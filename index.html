<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSXPress</title>
    <style>
      :root {
        color-scheme: dark;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --panel-border: rgba(148, 163, 184, 0.16);
        --shadow: 0 16px 50px rgba(15, 23, 42, 0.18);
        --danger-bg: rgba(239, 68, 68, 0.14);
        --danger-border: rgba(248, 113, 113, 0.35);
        --danger-text: #fecaca;
        --preview-bg: #ffffff;
        --preview-text: #111827;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      textarea {
        font: inherit;
      }

      .app-shell {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
        overflow: hidden;
      }

      .site-header {
        align-items: center;
        backdrop-filter: blur(14px);
        background: rgba(15, 23, 42, 0.84);
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
        display: flex;
        justify-content: space-between;
        padding: 18px 24px;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .brand-mark {
        color: #f8fafc;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .action-row {
        display: flex;
        gap: 10px;
      }

      .icon-button {
        align-items: center;
        appearance: none;
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 999px;
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        height: 42px;
        justify-content: center;
        padding: 0;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          transform 0.15s ease,
          opacity 0.15s ease;
        width: 42px;
      }

      .icon-button:hover:not(:disabled) {
        background: rgba(96, 165, 250, 0.14);
        border-color: rgba(96, 165, 250, 0.3);
        color: #dbeafe;
        transform: translateY(-1px);
      }

      .icon-button:active:not(:disabled) {
        transform: translateY(0);
      }

      .icon-button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .button-icon {
        fill: none;
        height: 18px;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
        width: 18px;
      }

      .workspace {
        --editor-size: 50%;
        display: flex;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        padding: 20px 24px 24px;
      }

      .workspace.resizing,
      .workspace.resizing * {
        cursor: col-resize;
        user-select: none;
      }

      .pane {
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        min-height: 0;
        overflow: hidden;
      }

      .editor-pane {
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        display: grid;
        flex: 0 0 var(--editor-size);
        height: 100%;
        min-width: 280px;
        padding: 0;
      }

      .preview-pane {
        background: var(--preview-bg);
        color: var(--preview-text);
        display: grid;
        flex: 1 1 auto;
        height: 100%;
        min-width: 280px;
      }

      .editor {
        background: transparent;
        border: 0;
        color: var(--text);
        min-height: 0;
        outline: none;
        overflow: auto;
        padding: 22px;
        resize: none;
        width: 100%;
        font-family:
          "SFMono-Regular", SFMono-Regular, ui-monospace, Menlo, Monaco,
          Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.95rem;
        line-height: 1.6;
        tab-size: 2;
      }

      .editor::placeholder {
        color: #64748b;
      }

      .error-panel {
        background: var(--danger-bg);
        border-top: 1px solid var(--danger-border);
        color: var(--danger-text);
        display: none;
        font-family:
          "SFMono-Regular", SFMono-Regular, ui-monospace, Menlo, Monaco,
          Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.88rem;
        line-height: 1.55;
        max-height: 180px;
        overflow: auto;
        padding: 14px 16px;
        white-space: pre-wrap;
      }

      .error-panel.visible {
        display: block;
      }

      .workspace-divider {
        align-items: center;
        appearance: none;
        background: transparent;
        border: 0;
        cursor: col-resize;
        display: inline-flex;
        flex: 0 0 18px;
        justify-content: center;
        margin: 0 8px;
        padding: 0;
        touch-action: none;
      }

      .workspace-divider-line {
        background: rgba(148, 163, 184, 0.28);
        border-radius: 999px;
        display: block;
        height: 100%;
        transition: background 0.15s ease;
        width: 4px;
      }

      .workspace-divider:hover .workspace-divider-line,
      .workspace-divider:focus-visible .workspace-divider-line {
        background: rgba(96, 165, 250, 0.8);
      }

      .workspace-divider:focus-visible {
        outline: none;
      }

      .preview-stage {
        min-height: 0;
        overflow: auto;
        padding: 20px;
      }

      .preview-canvas {
        background: #ffffff;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 16px;
        height: 100%;
        overflow: auto;
      }

      .preview-content {
        min-height: 100%;
        padding: 24px;
      }

      .preview-empty,
      .preview-error {
        align-content: center;
        color: #475569;
        display: grid;
        gap: 12px;
        justify-items: center;
        min-height: 260px;
        padding: 32px 24px;
        text-align: center;
      }

      .preview-empty strong,
      .preview-error strong {
        color: #0f172a;
        font-size: 1.05rem;
      }

      .preview-error {
        background: #fff7f7;
        border-radius: 16px;
      }

      .preview-note {
        color: #64748b;
        font-size: 0.94rem;
        line-height: 1.5;
        max-width: 360px;
      }

      .preview-empty-action {
        appearance: none;
        background: #111827;
        border: 0;
        border-radius: 999px;
        color: #ffffff;
        cursor: pointer;
        font-size: 0.92rem;
        font-weight: 600;
        padding: 10px 16px;
      }

      .toast {
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 999px;
        bottom: 24px;
        color: #f8fafc;
        opacity: 0;
        padding: 12px 16px;
        pointer-events: none;
        position: fixed;
        right: 24px;
        transform: translateY(8px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
        z-index: 20;
      }

      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 900px) {
        .workspace {
          flex-direction: column;
          gap: 16px;
          overflow: auto;
        }

        .editor-pane,
        .preview-pane {
          flex: none;
          height: auto;
          min-height: 320px;
          width: 100%;
        }

        .workspace-divider {
          display: none;
        }
      }

      @media (max-width: 640px) {
        .site-header,
        .workspace {
          padding-left: 16px;
          padding-right: 16px;
        }

        .site-header {
          gap: 12px;
        }

        .editor {
          padding: 18px;
        }

        .preview-stage {
          padding: 16px;
        }

        .toast {
          bottom: 16px;
          left: 16px;
          right: 16px;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="brand-mark">JSXPress</div>
        <div class="action-row">
          <button
            class="icon-button"
            id="example-button"
            type="button"
            aria-label="Load example"
            title="Load example"
          >
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3l1.7 4.7L18 9.4l-4.3 1.7L12 16l-1.7-4.9L6 9.4l4.3-1.7z"></path>
            </svg>
          </button>
          <button
            class="icon-button"
            id="copy-button"
            type="button"
            aria-label="Copy JSX"
            title="Copy JSX"
          >
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15V6a2 2 0 0 1 2-2h9"></path>
            </svg>
          </button>
          <button
            class="icon-button"
            id="share-button"
            type="button"
            aria-label="Copy share link"
            title="Copy a link that reopens this JSX"
          >
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.1 0l2.4-2.4a5 5 0 0 0-7.1-7.1L10.8 5"></path>
              <path d="M14 11a5 5 0 0 0-7.1 0L4.5 13.4a5 5 0 0 0 7.1 7.1L13.2 19"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="workspace" id="workspace">
        <section class="pane editor-pane" aria-label="JSX editor">
          <textarea
            id="editor"
            class="editor"
            spellcheck="false"
            aria-label="JSX source editor"
            placeholder="Paste JSX or a React component..."
          ></textarea>
          <div class="error-panel" id="error-panel" role="status"></div>
        </section>

        <button
          class="workspace-divider"
          id="workspace-divider"
          type="button"
          aria-label="Resize editor and preview"
          title="Drag to resize"
        >
          <span class="workspace-divider-line"></span>
        </button>

        <section class="pane preview-pane" aria-label="Rendered preview">
          <div class="preview-stage">
            <div class="preview-canvas">
              <div class="preview-content" id="preview-root"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <script>
      const STORAGE_KEY = "jsxpress-source";
      const SPLIT_KEY = "jsxpress-split";
      const COPY_RESET_DELAY = 2200;
      const RENDER_DELAY = 120;
      const DEFAULT_SPLIT = 50;
      const MIN_SPLIT = 28;
      const MAX_SPLIT = 72;
      const DEFAULT_SOURCE = `const [count, setCount] = React.useState(0);

return (
  <div
    style={{
      color: "#111827",
      fontFamily: "system-ui, sans-serif",
      lineHeight: 1.6,
      padding: 24
    }}
  >
    <h1 style={{ marginBottom: 12, marginTop: 0 }}>JSXPress</h1>
    <p style={{ marginTop: 0 }}>This example uses state and an event handler.</p>
    <button
      onClick={() => setCount(count + 1)}
      style={{
        background: "#111827",
        border: 0,
        borderRadius: 999,
        color: "#ffffff",
        cursor: "pointer",
        fontSize: 15,
        fontWeight: 600,
        padding: "10px 16px"
      }}
    >
      Clicked {count} times
    </button>
  </div>
);`;

      const LEGACY_DEFAULT_SOURCE = `const [count, setCount] = React.useState(0);

return (
  <div
    style={{
      color: "#111827",
      fontFamily: "system-ui, sans-serif",
      lineHeight: 1.6,
      padding: 24
    }}
  >
    <p
      style={{
        color: "#2563eb",
        fontSize: 13,
        fontWeight: 700,
        letterSpacing: "0.08em",
        margin: 0,
        textTransform: "uppercase"
      }}
    >
      JSXPress demo
    </p>
    <h1 style={{ marginBottom: 12, marginTop: 10 }}>Render JSX instantly</h1>
    <p style={{ marginTop: 0 }}>
      Paste JSX from a chat, component code from a file, or tweak this example.
    </p>
    <button
      onClick={() => setCount(count + 1)}
      style={{
        background: "#111827",
        border: 0,
        borderRadius: 999,
        color: "#ffffff",
        cursor: "pointer",
        fontSize: 15,
        fontWeight: 600,
        padding: "10px 16px"
      }}
    >
      Clicked {count} times
    </button>
  </div>
);`;

      const workspace = document.getElementById("workspace");
      const editor = document.getElementById("editor");
      const exampleButton = document.getElementById("example-button");
      const copyButton = document.getElementById("copy-button");
      const shareButton = document.getElementById("share-button");
      const divider = document.getElementById("workspace-divider");
      const toast = document.getElementById("toast");
      const errorPanel = document.getElementById("error-panel");
      const previewRootElement = document.getElementById("preview-root");
      const previewRoot = ReactDOM.createRoot(previewRootElement);

      let renderTimer = 0;
      let renderVersion = 0;
      let toastTimer = 0;
      let dragging = false;
      let splitPercent = DEFAULT_SPLIT;

      class PreviewErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { error: null };
        }

        static getDerivedStateFromError(error) {
          return { error: error };
        }

        componentDidCatch(error) {
          showRenderError(error);
        }

        componentDidUpdate(prevProps) {
          if (
            this.state.error &&
            prevProps.resetKey !== this.props.resetKey
          ) {
            this.setState({ error: null });
          }
        }

        render() {
          if (this.state.error) {
            return React.createElement(
              "div",
              { className: "preview-error" },
              React.createElement("strong", null, "Render error"),
              React.createElement(
                "div",
                { className: "preview-note" },
                formatErrorMessage(this.state.error)
              )
            );
          }

          return this.props.children;
        }
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toast.classList.remove("visible");
        }, COPY_RESET_DELAY);
      }

      function clearError() {
        errorPanel.textContent = "";
        errorPanel.classList.remove("visible");
      }

      function showRenderError(error) {
        errorPanel.textContent = formatErrorMessage(error);
        errorPanel.classList.add("visible");
        renderUnavailableState();
      }

      function formatErrorMessage(error) {
        if (!error) {
          return "Unknown error";
        }

        if (typeof error === "string") {
          return error;
        }

        if (error.message) {
          return error.message;
        }

        return String(error);
      }

      function syncActionState() {
        const hasSource = editor.value.trim().length > 0;
        copyButton.disabled = !hasSource;
        shareButton.disabled = !hasSource;
      }

      function renderEmptyState() {
        previewRoot.render(
          React.createElement(
            "div",
            { className: "preview-empty" },
            React.createElement("strong", null, "Paste JSX to preview"),
            React.createElement(
              "div",
              { className: "preview-note" },
              "Use the editor on the left, or load an example."
            ),
            React.createElement(
              "button",
              {
                className: "preview-empty-action",
                onClick: loadExampleSource,
                type: "button"
              },
              "Load example"
            )
          )
        );
      }

      function renderUnavailableState() {
        previewRoot.render(
          React.createElement(
            "div",
            { className: "preview-error" },
            React.createElement("strong", null, "Preview unavailable"),
            React.createElement(
              "div",
              { className: "preview-note" },
              "Fix the JSX to keep rendering."
            )
          )
        );
      }

      function normalizeLineEndings(value) {
        return value.replace(/\r\n?/g, "\n");
      }

      function encodeSource(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = "";

        for (const byte of bytes) {
          binary += String.fromCharCode(byte);
        }

        return btoa(binary)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/g, "");
      }

      function decodeSource(value) {
        const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
        const padding = normalized.length % 4;
        const padded =
          normalized + (padding === 0 ? "" : "=".repeat(4 - padding));
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, function (char) {
          return char.charCodeAt(0);
        });

        return new TextDecoder().decode(bytes);
      }

      function stripUseClientDirectives(value) {
        return value.replace(/^\s*["']use client["'];?\s*$/gm, "");
      }

      function isSupportedImport(statement) {
        return (
          /from\s+["']react(?:\/jsx-runtime)?["']\s*;?\s*$/.test(statement) ||
          /from\s+["']react-dom\/client["']\s*;?\s*$/.test(statement) ||
          /^import\s+["'][^"']+\.(?:css|scss|sass|less)["']\s*;?\s*$/.test(
            statement.trim()
          )
        );
      }

      function stripSupportedImports(value) {
        const lines = value.split("\n");
        const keptLines = [];
        let importBuffer = [];
        let importOpen = false;

        function flushImportBuffer() {
          const statement = importBuffer.join("\n").trim();
          if (statement && !isSupportedImport(statement)) {
            keptLines.push(importBuffer.join("\n"));
          }
          importBuffer = [];
          importOpen = false;
        }

        for (const line of lines) {
          if (!importOpen && /^\s*import\b/.test(line)) {
            importOpen = true;
            importBuffer.push(line);

            if (/;\s*$/.test(line) || /^\s*import\s+["']/.test(line)) {
              flushImportBuffer();
            }

            continue;
          }

          if (importOpen) {
            importBuffer.push(line);

            if (/;\s*$/.test(line)) {
              flushImportBuffer();
            }

            continue;
          }

          keptLines.push(line);
        }

        if (importBuffer.length > 0) {
          flushImportBuffer();
        }

        return keptLines.join("\n");
      }

      function convertDefaultExport(value) {
        if (/^\s*export\s+default\s+function\b/m.test(value)) {
          return value.replace(
            /^\s*export\s+default\s+function\b/m,
            "const __jsxpressComponent = function"
          );
        }

        if (/^\s*export\s+default\s+class\b/m.test(value)) {
          return value.replace(
            /^\s*export\s+default\s+class\b/m,
            "const __jsxpressComponent = class"
          );
        }

        if (/^\s*export\s+default\s+/m.test(value)) {
          return value.replace(
            /^\s*export\s+default\s+/m,
            "const __jsxpressComponent = "
          );
        }

        if (/^\s*module\.exports\s*=\s*/m.test(value)) {
          return value.replace(
            /^\s*module\.exports\s*=\s*/m,
            "const __jsxpressComponent = "
          );
        }

        if (/^\s*exports\.default\s*=\s*/m.test(value)) {
          return value.replace(
            /^\s*exports\.default\s*=\s*/m,
            "const __jsxpressComponent = "
          );
        }

        return value;
      }

      function stripNamedExports(value) {
        return value
          .replace(
            /^\s*export\s+(?=(const|let|var|function|class|type|interface)\b)/gm,
            ""
          )
          .replace(/^\s*export\s*\{[\s\S]*?\}\s*;?\s*$/gm, "");
      }

      function findDeclaredComponentName(value) {
        const patterns = [
          /(?:^|\n)\s*function\s+([A-Z][A-Za-z0-9_$]*)\s*\(/g,
          /(?:^|\n)\s*class\s+([A-Z][A-Za-z0-9_$]*)\s+extends\b/g,
          /(?:^|\n)\s*(?:const|let|var)\s+([A-Z][A-Za-z0-9_$]*)\s*=\s*(?:async\s*)?(?:\([^=]*\)|[A-Za-z_$][A-Za-z0-9_$]*)\s*=>/g,
          /(?:^|\n)\s*(?:const|let|var)\s+([A-Z][A-Za-z0-9_$]*)\s*=\s*function\b/g
        ];

        let detectedName = "";

        for (const pattern of patterns) {
          let match = pattern.exec(value);
          while (match) {
            detectedName = match[1];
            match = pattern.exec(value);
          }
        }

        return detectedName;
      }

      function indentBlock(value, spaces) {
        const padding = " ".repeat(spaces);
        return value
          .split("\n")
          .map(function (line) {
            return line ? padding + line : line;
          })
          .join("\n");
      }

      function normalizeSource(input) {
        let source = normalizeLineEndings(input).trim();

        if (!source) {
          throw new Error("Paste some JSX to start rendering.");
        }

        source = stripUseClientDirectives(source);
        source = stripSupportedImports(source);
        source = convertDefaultExport(source);
        source = stripNamedExports(source).trim();

        if (/\b(?:ReactDOM\.createRoot|createRoot)\s*\(/.test(source)) {
          throw new Error(
            "Paste a component or JSX snippet instead of a full app bootstrap."
          );
        }

        if (/^\s*(?:import|export)\b/m.test(source)) {
          throw new Error(
            "Only self-contained React snippets are supported. Remove external imports and exports."
          );
        }

        if (/\bconst\s+__jsxpressComponent\b/.test(source)) {
          return source;
        }

        const namedComponent = findDeclaredComponentName(source);
        if (namedComponent) {
          return source + "\n\nconst __jsxpressComponent = " + namedComponent + ";";
        }

        if (
          /\breturn\b/.test(source) ||
          /\bReact\.use[A-Z]/.test(source) ||
          /\buse[A-Z][A-Za-z0-9_]*\s*\(/.test(source) ||
          /^\s*(const|let|var|if|for|while|switch|try)\b/m.test(source)
        ) {
          return (
            "function __jsxpressComponent() {\n" +
            indentBlock(source, 2) +
            "\n}"
          );
        }

        return (
          "function __jsxpressComponent() {\n" +
          "  return (\n" +
          "    <>\n" +
          indentBlock(source, 6) +
          "\n" +
          "    </>\n" +
          "  );\n" +
          "}"
        );
      }

      function compileComponent(source) {
        const normalized = normalizeSource(source);
        const compiled = Babel.transform(normalized, {
          filename: "snippet.tsx",
          presets: [
            ["react", { runtime: "classic" }],
            ["typescript", { allExtensions: true, isTSX: true }]
          ]
        }).code;

        const createComponent = new Function(
          "React",
          '"use strict";\n' +
            "const { Children, Fragment, Suspense, cloneElement, createContext, createElement, forwardRef, isValidElement, lazy, memo, startTransition, useCallback, useContext, useDebugValue, useDeferredValue, useEffect, useId, useImperativeHandle, useInsertionEffect, useLayoutEffect, useMemo, useReducer, useRef, useState, useSyncExternalStore, useTransition } = React;\n" +
            compiled +
            "\nif (typeof __jsxpressComponent === 'undefined') {\n" +
            "  throw new Error('JSXPress could not find a component to render.');\n" +
            "}\n" +
            "return __jsxpressComponent;"
        );

        return createComponent(React);
      }

      function renderPreview(source) {
        const Component = compileComponent(source);
        renderVersion += 1;

        previewRoot.render(
          React.createElement(
            PreviewErrorBoundary,
            { resetKey: renderVersion },
            React.createElement(Component)
          )
        );
      }

      function performRender() {
        const source = editor.value;
        syncActionState();
        clearError();

        if (!source.trim()) {
          renderEmptyState();
          return;
        }

        try {
          renderPreview(source);
        } catch (error) {
          showRenderError(error);
        }
      }

      function scheduleRender() {
        window.clearTimeout(renderTimer);
        renderTimer = window.setTimeout(performRender, RENDER_DELAY);
      }

      async function copySource() {
        try {
          await navigator.clipboard.writeText(editor.value);
          showToast("Copied JSX");
        } catch (error) {
          showToast("Copy failed");
        }
      }

      function setShareHash() {
        const hash = "#jsx=" + encodeSource(editor.value);
        window.history.replaceState(null, "", hash);
        return window.location.origin + window.location.pathname + hash;
      }

      async function copyShareLink() {
        try {
          const shareUrl = setShareHash();
          await navigator.clipboard.writeText(shareUrl);
          showToast("Share link copied. Opening it restores this JSX.");
        } catch (error) {
          showToast("Copy link failed");
        }
      }

      function loadExampleSource() {
        editor.value = DEFAULT_SOURCE;
        persistSource();
        syncActionState();
        editor.focus();
        scheduleRender();
      }

      function persistSource() {
        localStorage.setItem(STORAGE_KEY, editor.value);
      }

      function clearShareHash() {
        if (window.location.hash.startsWith("#jsx=")) {
          const target = window.location.pathname + window.location.search;
          window.history.replaceState(null, "", target);
        }
      }

      function readSourceFromHash() {
        const match = window.location.hash.match(/^#jsx=([\s\S]+)$/);

        if (!match) {
          return "";
        }

        try {
          return decodeSource(match[1]);
        } catch (error) {
          showToast("This share link could not be decoded");
          return "";
        }
      }

      function isLegacyExample(value) {
        return value === DEFAULT_SOURCE || value === LEGACY_DEFAULT_SOURCE;
      }

      function loadSource() {
        const shared = readSourceFromHash();

        if (shared) {
          editor.value = shared;
          return;
        }

        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved === null || isLegacyExample(saved)) {
          editor.value = "";
          return;
        }

        editor.value = saved;
      }

      function clampSplit(value) {
        return Math.min(MAX_SPLIT, Math.max(MIN_SPLIT, value));
      }

      function applySplit(value) {
        splitPercent = clampSplit(value);
        workspace.style.setProperty("--editor-size", splitPercent + "%");
        localStorage.setItem(SPLIT_KEY, String(splitPercent));
      }

      function loadSplit() {
        const saved = Number(localStorage.getItem(SPLIT_KEY));
        if (Number.isFinite(saved)) {
          applySplit(saved);
          return;
        }

        applySplit(DEFAULT_SPLIT);
      }

      function updateSplitFromPointer(clientX) {
        const rect = workspace.getBoundingClientRect();
        const next =
          ((clientX - rect.left) / Math.max(rect.width, 1)) * 100;
        applySplit(next);
      }

      function startResize(event) {
        if (window.innerWidth <= 900) {
          return;
        }

        dragging = true;
        workspace.classList.add("resizing");
        divider.setPointerCapture(event.pointerId);
      }

      function moveResize(event) {
        if (!dragging) {
          return;
        }

        updateSplitFromPointer(event.clientX);
      }

      function stopResize(event) {
        if (!dragging) {
          return;
        }

        dragging = false;
        workspace.classList.remove("resizing");
        if (event && typeof event.pointerId === "number") {
          divider.releasePointerCapture(event.pointerId);
        }
      }

      window.addEventListener("error", function (event) {
        if (event.error) {
          showRenderError(event.error);
        }
      });

      window.addEventListener("unhandledrejection", function (event) {
        showRenderError(event.reason || "Unhandled promise rejection");
      });

      editor.addEventListener("input", function () {
        persistSource();
        syncActionState();
        clearShareHash();
        scheduleRender();
      });

      exampleButton.addEventListener("click", loadExampleSource);
      copyButton.addEventListener("click", copySource);
      shareButton.addEventListener("click", copyShareLink);

      divider.addEventListener("pointerdown", startResize);
      divider.addEventListener("pointermove", moveResize);
      divider.addEventListener("pointerup", stopResize);
      divider.addEventListener("pointercancel", stopResize);
      divider.addEventListener("keydown", function (event) {
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          applySplit(splitPercent - 4);
        }

        if (event.key === "ArrowRight") {
          event.preventDefault();
          applySplit(splitPercent + 4);
        }
      });

      window.addEventListener("hashchange", function () {
        const shared = readSourceFromHash();

        editor.value = shared;
        persistSource();
        syncActionState();
        scheduleRender();
      });

      loadSplit();
      loadSource();
      syncActionState();
      performRender();
    </script>
  </body>
</html>
